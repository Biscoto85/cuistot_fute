# /etc/nginx/sites-available/cuistotfute
# Activer : ln -s /etc/nginx/sites-available/cuistotfute /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name cuistotfute.mondomaine.fr;
    # Redirection HTTP → HTTPS (décommenter après certbot)
    # return 301 https://$host$request_uri;

    # ── Frontend (fichiers statiques buildés) ────────────────────────────────
    root /var/www/cuistot_fute/apps/web/dist;
    index index.html;

    # SPA : toutes les routes non-fichier → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API (proxy vers Express port 3003) ───────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout long pour la génération LLM (~40s possible)
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── Sécurité basique ─────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

